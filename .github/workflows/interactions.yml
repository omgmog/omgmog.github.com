name: Update Interactions Data

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: read

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  interactions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Fetch Morris index
        id: morris-index
        run: |
          curl -sf https://wm.omgmog.net/morris/data/index.json -o /tmp/morris-index.json
          echo "hash=$(sha256sum /tmp/morris-index.json | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Restore webmentions cache
        id: wm-cache
        uses: actions/cache@v5
        with:
          path: _data/webmentions.json
          key: webmentions-${{ steps.morris-index.outputs.hash }}-${{ hashFiles('scripts/fetch_webmentions.rb') }}

      - name: Fetch webmentions from Morris
        if: steps.wm-cache.outputs.cache-hit != 'true'
        run: bundle exec ruby scripts/fetch_webmentions.rb

      - name: Fill in Mastodon replies missing a webmention
        run: bundle exec ruby scripts/fetch_mastodon_replies.rb

      - name: Fetch GitHub comments
        run: bundle exec ruby scripts/fetch_github_comments.rb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add _data/webmentions.json _data/github_comments.json
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            last_subject=$(git log -1 --pretty=%s)
            last_author=$(git log -1 --pretty=%ae)

            if [ "$last_subject" = "Update data" ] && \
               [ "$last_author" = "actions@github.com" ]; then
              git commit --amend --no-edit
            else
              git commit -m "Update data"
            fi

            for i in 1 2 3; do
              if git push --force-with-lease; then
                break
              fi
              echo "Push rejected, retrying ($i/3)..."
              git pull --rebase
            done

            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Jekyll build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run jekyll.yml
