name: Update Last.fm Data

on:
  schedule:
    - cron: "5 * * * *" # hourly
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  lastfm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Fetch Last.fm data
        env:
          LASTFM_USERNAME: moglenstar
          LASTFM_API_KEY: 6bcfcb1e0c192d84adf10cf95b0589e3
        run: node .github/lastfm.js

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add _data/now/lastfm.json
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            last_subject=$(git log -1 --pretty=%s)
            last_author=$(git log -1 --pretty=%ae)

            if [ "$last_subject" = "Update data" ] && \
               [ "$last_author" = "actions@github.com" ]; then
              git commit --amend --no-edit
            else
              git commit -m "Update data"
            fi

            for i in 1 2 3; do
              if git push --force-with-lease; then
                break
              fi
              echo "Push rejected, retrying ($i/3)..."
              git pull --rebase
            done

            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Jekyll build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run jekyll.yml
