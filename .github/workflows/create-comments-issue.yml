name: Create Comments Issue

on:
  workflow_run:
    workflows: ["Deploy Jekyll site to Pages"]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  create-comments-issue:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Find newly added posts
        id: added
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev_sha=$(gh api "repos/${{ github.repository }}/actions/workflows/jekyll.yml/runs?status=success&per_page=2" \
            --jq '.workflow_runs[1].head_sha // empty')

          if [ -n "$prev_sha" ] && git cat-file -e "${prev_sha}^{commit}" 2>/dev/null; then
            base="$prev_sha"
          else
            base="HEAD^"
          fi

          added=$(git diff --name-only --diff-filter=A "$base" HEAD -- '_posts/**' | tr '\n' ' ')
          echo "files=$added" >> $GITHUB_OUTPUT

      - name: Setup Ruby
        if: steps.added.outputs.files != ''
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Create missing comments issues
        if: steps.added.outputs.files != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADDED_POSTS: ${{ steps.added.outputs.files }}
        run: ruby scripts/create_comments_issues.rb $ADDED_POSTS
