<svg viewBox="-60 0 480 54" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', 'Arial Nova', Helvetica, Arial, sans-serif" role="img" aria-label="With one shared buffer, the other channel's message wipes the buffer: the first two video fragments are thrown away, and the third video fragment ends up glued onto the other message.">
