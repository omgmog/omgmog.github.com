<svg viewBox="0 0 860 350" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', 'Arial Nova', Helvetica, Arial, sans-serif" role="img" aria-label="Two-panel diagram: the AP30's 480MB eMMC is divided into a 28.67MB firmware partition, a 234MB unidentified region, and 210MB of internal storage; zooming into the firmware partition shows it splits into roughly 1.4MB of resident application code — containing the OS/driver layer, audio codec dispatch, and the MainMenu/Game UI — followed by codec objects, bitmap/string resources, and padding out to 28.67MB.">
<style>
  text { fill: light-dark(#1a1a1a, #f0f0f0); }
  .label { fill: light-dark(#1a1a1a, #f0f0f0); opacity: 0.6; }
  .outline { stroke: light-dark(#1a1a1a, #f0f0f0); }
  .panel { fill: light-dark(#fafafa, #000000); }
  .accent { fill: #ffea00; }
  .accent-text { fill: #000000; }
</style>

  <!-- ============ PANEL 1: full eMMC ============ -->
  <text x="20" y="30" font-size="13" font-weight="600">eMMC — 480 MB total</text>

  <rect class="accent outline" x="20" y="48" width="63" height="60" stroke-width="1.5"></rect>
  <text class="accent-text" x="51" y="74" font-size="11" text-anchor="middle" font-weight="600">firmware</text>
  <text class="accent-text" x="51" y="88" font-size="10" text-anchor="middle">28.67 MB</text>

  <rect class="panel outline" x="83" y="48" width="4" height="60" stroke-width="1" opacity="0.4"></rect>

  <rect class="panel outline" x="87" y="48" width="391" height="60" stroke-width="1.5"></rect>
  <text x="282" y="74" font-size="11" text-anchor="middle">unidentified region</text>
  <text class="label" x="282" y="88" font-size="10" text-anchor="middle">234 MB</text>

  <rect class="panel outline" x="478" y="48" width="358" height="60" stroke-width="1.5"></rect>
  <text x="657" y="74" font-size="11" text-anchor="middle">210 MB internal storage</text>

  <text class="label" x="20" y="122" font-size="9.5">0x0</text>
  <text class="label" x="83" y="122" font-size="9.5" text-anchor="middle">0x1B58000</text>
  <text class="label" x="478" y="122" font-size="9.5" text-anchor="middle">0x10608000</text>
  <text class="label" x="836" y="122" font-size="9.5" text-anchor="end">0x1DC00000</text>

  <!-- ============ PANEL 2: firmware partition internal layout ============ -->
  <text x="20" y="192" font-size="13" font-weight="600">Inside the firmware partition — 28.67 MB</text>

  <!-- resident app code 0x1000-0x160000, subdivided -->
  <rect class="accent outline" x="20" y="210" width="63" height="70" stroke-width="1.5"></rect>
  <text class="accent-text" x="51" y="234" font-size="9.5" text-anchor="middle" font-weight="600">OS /</text>
  <text class="accent-text" x="51" y="246" font-size="9.5" text-anchor="middle" font-weight="600">drivers</text>

  <rect class="accent outline" x="83" y="210" width="59" height="70" stroke-width="1.5"></rect>
  <text class="accent-text" x="112" y="234" font-size="9.5" text-anchor="middle" font-weight="600">audio</text>
  <text class="accent-text" x="112" y="246" font-size="9.5" text-anchor="middle" font-weight="600">codecs</text>

  <rect class="accent outline" x="142" y="210" width="107" height="70" stroke-width="1.5"></rect>
  <text class="accent-text" x="195" y="230" font-size="9.5" text-anchor="middle" font-weight="600">MainMenu / UI</text>
  <text class="accent-text" x="195" y="243" font-size="8.6" text-anchor="middle" font-weight="600">Music · Browser</text>
  <text class="accent-text" x="195" y="255" font-size="8.6" text-anchor="middle" font-weight="600">· Game</text>

  <text x="126" y="296" font-size="10" text-anchor="middle">resident application code</text>
  <text class="label" x="126" y="309" font-size="9.5" text-anchor="middle">0x1000 – 0x160000 (~1.4 MB)</text>

  <!-- rest of partition -->
  <rect class="panel outline" x="249" y="210" width="587" height="70" stroke-width="1.2"></rect>
  <text x="542" y="240" font-size="10.5" text-anchor="middle">codec objects · bitmap &amp; string resources · padding</text>
  <text class="label" x="542" y="256" font-size="9.5" text-anchor="middle">0x160000 – 0x1B58000 (~27 MB) — confirmed non-code</text>

  <text class="label" x="20" y="333" font-size="9.5">0x0</text>
  <text class="label" x="249" y="333" font-size="9.5" text-anchor="middle">0x160000</text>
  <text class="label" x="836" y="333" font-size="9.5" text-anchor="end">0x1B58000</text>

</svg>
