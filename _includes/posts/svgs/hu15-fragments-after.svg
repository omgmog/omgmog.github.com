<svg viewBox="-60 0 480 98" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', 'Arial Nova', Helvetica, Arial, sans-serif" role="img" aria-label="With one buffer per channel, the video buffer holds all three fragments and the other channel's message sits in its own buffer below.">
<style>
  text { fill: light-dark(#1a1a1a, #f0f0f0); }
  .label { fill: light-dark(#1a1a1a, #f0f0f0); opacity: 0.6; }
  .panel { fill: light-dark(#fafafa, #000000); stroke: light-dark(#1a1a1a, #f0f0f0); }
  .accent { fill: #ffea00; stroke: light-dark(#1a1a1a, #f0f0f0); }
  .accent-text { fill: #000000; }
  .missing { fill: light-dark(#fafafa, #000000); stroke: light-dark(#1a1a1a, #f0f0f0); stroke-dasharray: 4 3; stroke-opacity: 0.5; }
  .track { stroke: light-dark(#1a1a1a, #f0f0f0); stroke-width: 1.5; opacity: 0.4; }
</style>
  <line class="track" x1="0" y1="27" x2="360" y2="27"></line>
  <line class="track" x1="0" y1="71" x2="360" y2="71"></line>
  <rect class="accent" x="10" y="10" width="80" height="34" stroke-width="1.5"></rect>
  <text class="accent-text" x="50" y="31" font-size="11" text-anchor="middle" font-weight="600">video 1/3</text>
  <rect class="accent" x="96" y="10" width="80" height="34" stroke-width="1.5"></rect>
  <text class="accent-text" x="136" y="31" font-size="11" text-anchor="middle" font-weight="600">video 2/3</text>
  <rect class="accent" x="268" y="10" width="80" height="34" stroke-width="1.5"></rect>
  <text class="accent-text" x="308" y="31" font-size="11" text-anchor="middle" font-weight="600">video 3/3</text>
  <rect class="panel" x="182" y="54" width="80" height="34" stroke-width="1.5"></rect>
  <text x="222" y="75" font-size="11" text-anchor="middle">other</text>
</svg>
