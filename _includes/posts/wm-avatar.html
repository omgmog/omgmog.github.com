{% if include.is_author %}<img src="{{ '/assets/mog.svg' | relative_url }}" alt="{{ include.name | escape }}'s avatar picture" class="avatar" loading="lazy">{% else %}<span class="avatar avatar-text" data-username="{{ include.name | escape }}" style="--h: {{ include.name | avatar_hue }}" {% if include.label %}role="img" aria-label="{{ include.label | escape }}"{% else %}aria-hidden="true"{% endif %}>{{ include.name | avatar_initial | escape }}</span>{% endif %}
