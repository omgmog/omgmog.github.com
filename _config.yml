permalink: /post/:title/
timezone: Europe/London
exclude: ["_dev.yml","_config.yml", ".gitignore", "README.md", ".jekyll-cache", "vendor", "Gemfile", "Gemfile.lock", "scripts", "node_modules", "Dockerfile", "docker-compose.yml", ".sass-cache"]
url: "https://blog.omgmog.net"
assets_url: "https://assets.omgmog.net"
excerpt_separator: "<!-- more -->"
keep_files: ["images/","assets/","pagefind","CNAME"]
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
title: "Max Glenister"
plugins:
  - jekyll-sitemap

author:
  name: Max Glenister

  
collections:
  cardboctober:
    output: true
    permalink: /:collection/:title/
  lwal:
    output: true
    permalink: /:collection/:title/
defaults:
  - scope:
      type: "posts"
    values:
      layout: post
      type: blog
      content_type: article
  - scope:
      type: "cardboctober"
    values:
      layout: post
      tags: [vr, cardboctober]
      category: games
      content_type: article
      series: cardboctober
  - scope:
      type: "lwal"
    values:
      layout: post
      category: lwal
      content_type: article
  - scope:
      type: "pages"
    values:
      layout: page